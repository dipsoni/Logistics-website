[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/inquiry"
  to = "/.netlify/functions/inquiry"
  status = 200

[[redirects]]
  from = "/api/admin/inquiries"
  to = "/.netlify/functions/adminInquiries"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
